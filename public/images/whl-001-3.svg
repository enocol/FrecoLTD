<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="18 inch graphite alloy wheel, spoke detail close-up">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#323b47"/>
      <stop offset="100%" stop-color="#10141a"/>
    </radialGradient>
    <linearGradient id="metal3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f4f7"/>
      <stop offset="45%" stop-color="#9aa2ad"/>
      <stop offset="100%" stop-color="#4c535e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- zoomed hub + spokes detail -->
  <circle cx="300" cy="320" r="320" fill="#20262e"/>
  <circle cx="300" cy="320" r="320" fill="none" stroke="#0e1116" stroke-width="10"/>

  <!-- two bold spokes -->
  <g fill="url(#metal3)">
    <path d="M300 320 L250 -40 L350 -40 Z"/>
    <path d="M300 320 L560 70 L630 150 Z"/>
    <path d="M300 320 L640 360 L600 440 Z"/>
  </g>

  <!-- hub -->
  <circle cx="300" cy="320" r="120" fill="#cfd6de" stroke="#2a2f37" stroke-width="6"/>
  <g fill="#1b1f25">
    <circle cx="300" cy="222" r="15"/>
    <circle cx="393" cy="290" r="15"/>
    <circle cx="358" cy="400" r="15"/>
    <circle cx="242" cy="400" r="15"/>
    <circle cx="207" cy="290" r="15"/>
  </g>
  <circle cx="300" cy="320" r="52" fill="#c4161c"/>
  <text x="300" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">FRECO</text>

  <!-- machined highlight -->
  <path d="M120 180 A220 220 0 0 1 470 170" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.25"/>

  <text x="40" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8ebef">18&#34; Alloy — Graphite</text>
  <text x="760" y="560" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9aa1ac">Spoke detail</text>
</svg>
